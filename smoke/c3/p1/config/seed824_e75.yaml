schema_version: 1
stage: seed824_common_budget_extension
execution_policy: restart_all
execution_policy_reason: >-
  The 50-epoch comparison used a cosine schedule parameterized for 50 epochs, so
  its first 50 learning-rate steps are not equivalent to a from-scratch 75-epoch
  schedule. All six conditions therefore restart from the same pretrained model.
seed: 824
epochs: 75
device: 0
source_config_epochs: 30
only_protocol_change: epochs
locked:
  model: yolo11n.pt
  train_images_per_dataset: 100
  batch: 8
  imgsz: 640
  optimizer: AdamW
  lr0: 0.001
  weight_decay: 0.0005
  scheduler: cosine
  amp: false
runs:
  - {dataset: neu_det, method: full_sft, run_id: neu_full_seed824_e75}
  - {dataset: neu_det, method: frozen_backbone, run_id: neu_frozen_seed824_e75}
  - {dataset: neu_det, method: vpeft, run_id: neu_vpeft_seed824_e75}
  - {dataset: deeppcb, method: full_sft, run_id: deeppcb_full_seed824_e75}
  - {dataset: deeppcb, method: frozen_backbone, run_id: deeppcb_frozen_seed824_e75}
  - {dataset: deeppcb, method: vpeft, run_id: deeppcb_vpeft_seed824_e75}
