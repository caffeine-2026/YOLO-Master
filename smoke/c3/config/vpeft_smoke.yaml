# GPU AMP 候选配置；2026-08-24 实测触发非有限值恢复，稳定 FP32 复跑通过命令行 `amp=false` 覆盖。
# 用法：yolo train cfg=smoke/c3/config/vpeft_smoke.yaml \
#   data=smoke/c3/config/datasets/neu_det_fewshot.yaml name=neu_det

task: detect
mode: train
model: yolo11n.pt
data: smoke/c3/config/datasets/neu_det_fewshot.yaml
device: 0

epochs: 1
batch: 1
imgsz: 320
workers: 0
seed: 824
deterministic: true
amp: true
cache: false
val: true
plots: false
patience: 0
close_mosaic: 0
project: runs/vpeft_smoke
name: smoke
exist_ok: true

# 适配器注入后端：`auto` 优先使用外部 PEFT 包，普通 LoRA 也可使用仓库内回退实现。
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_backend: auto
lora_type: lora
lora_use_rslora: true
lora_gradient_checkpointing: false
lora_few_shot_mode: true
lora_few_shot_adaptive_rank: false
lora_save_adapters: true

# V-PEFT 放置编译器：必须显式启用；仓库默认值为 `legacy`。
lora_planner_enabled: true
lora_planner_backend: vpeft
lora_planner_solver: ao
lora_adapter_budget: 2100000
lora_vpeft_strict: true
# V-PEFT 通过数字模块路径无法自动识别 YOLO 的首个 stem 卷积；该层输入通道数为 3，不能承载 rank 8。
lora_exclude_modules:
  - 0.conv
