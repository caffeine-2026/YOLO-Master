schema_version: 1
stage: seed824_initial_scaling
status: seed824_complete
research_question: Which training strategy is most suitable at each industrial few-shot data scale?

datasets:
  names: [NEU-DET, DeepPCB]
  sample_sizes: [10, 50, 100, 500]
  split_seed: 824
  nesting: 10_subset_50_subset_100_subset_500
  p1_100_membership_is_hard_anchor: true
  validation_test_fixed_within_dataset: true

training:
  model: yolo11n.pt
  pretrained: true
  epochs: 100
  batch: 8
  imgsz: 640
  workers: 0
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  momentum: 0.9
  scheduler: cosine
  warmup_epochs: 3.0
  patience: 0
  amp: false
  deterministic: true
  seeds_this_stage: [824]
  prohibited_seeds_this_stage: [825, 826]
  device_policy: one exclusive NVIDIA GeForce RTX 4090 per run

methods:
  full_sft:
    lora_r: 0
    freeze: 0
  frozen_backbone:
    lora_r: 0
    freeze: 11
    frozen_top_level_modules: model.0-model.10
  vpeft:
    lora_r: 8
    lora_alpha: 16
    lora_planner_enabled: true
    lora_planner_backend: vpeft
    lora_planner_solver: ao
    lora_vpeft_strict: true
    required_actual_backend: peft

execution:
  matrix_cells: 24
  p1_100_seed824_reuse_cells: 6
  new_seed824_runs: 18
  completed_new_seed824_runs: 18
  completed_seed824_cells: 24
  new_sample_sizes: [10, 50, 500]
  p1_history_mutation_allowed: false
  overwrite_allowed: false

statistics:
  primary_metric: mAP50-95
  retention_baseline: Full-SFT at the same dataset, sample size, and seed
  resource_metrics: [peak_gpu_memory_mib, training_seconds, gpu_hours]
  trainable_parameter_efficiency: accuracy_vs_trainable_parameter_ratio

multiseed_gate:
  status: READY
  decision: MULTISEED_READY=YES
  overall_c3_p2: IN_PROGRESS
  auto_run_seed825_826: false
